<div id="royspins-font-options" style="display:grid; gap:16px; width:100%;">
  <style>
    #royspins-font-options .font-option { display:grid; grid-template-columns:minmax(120px, 0.35fr) minmax(0, 1fr); gap:16px; align-items:center; padding:14px 0; border-bottom:1px solid var(--border); }
    #royspins-font-options .font-preview { color:var(--foreground); text-shadow:2px 2px 0 color-mix(in srgb, var(--viz-series-1) 35%, transparent); }
    #royspins-font-options .font-preview span { display:block; }
    #royspins-font-options .royal-clean { font-family:"Trebuchet MS", Verdana, Arial, sans-serif; font-weight:500; letter-spacing:.02em; }
    #royspins-font-options .casino-bold { font-family:Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; font-weight:400; letter-spacing:.03em; text-transform:uppercase; }
    #royspins-font-options .modern-rounded { font-family:"Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif; font-weight:500; }
    #royspins-font-options .luxury-serif { font-family:Georgia, "Times New Roman", serif; font-weight:500; }
    #royspins-font-options .royal-italic { font-family:Georgia, "Times New Roman", serif; font-weight:500; font-style:italic; }
    #royspins-font-options .wide-display { font-family:Verdana, Tahoma, Arial, sans-serif; font-weight:500; letter-spacing:.08em; text-transform:uppercase; }
    @media (max-width:520px) { #royspins-font-options .font-option { grid-template-columns:1fr; gap:6px; } }
  </style>
  <div class="font-option"><div class="text-muted">1 · Royal clean</div><div class="font-preview royal-clean"><span>Email</span><span>Verification</span></div></div>
  <div class="font-option"><div class="text-muted">2 · Casino bold</div><div class="font-preview casino-bold"><span>Email</span><span>Verification</span></div></div>
  <div class="font-option"><div class="text-muted">3 · Modern rounded</div><div class="font-preview modern-rounded"><span>Email</span><span>Verification</span></div></div>
  <div class="font-option"><div class="text-muted">4 · Luxury serif</div><div class="font-preview luxury-serif"><span>Email</span><span>Verification</span></div></div>
  <div class="font-option"><div class="text-muted">5 · Royal italic</div><div class="font-preview royal-italic"><span>Email</span><span>Verification</span></div></div>
  <div class="font-option"><div class="text-muted">6 · Wide display</div><div class="font-preview wide-display"><span>Email</span><span>Verification</span></div></div>
</div>
